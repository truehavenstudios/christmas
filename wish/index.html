:root{--bg:#F7F1EA;--bg2:#EFE5DA;--card:#FDFAF6;--ink:#1A1C20;--ink2:#55534E;--ink3:#64605A;--line:#E9DED2;--line2:#D9C9B8;--acc:#8E2F3A;--acc2:#F6E4E2;--hl:#C9A25E;--bad:#B0281C;--ok:#2E7558;
  --serif:"Bodoni","Bodoni 72","Didot",Georgia,serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#181314;--bg2:#251D1F;--card:#201A1B;--ink:#F2EEE8;--ink2:#B6AFA5;--ink3:#9C968B;--line:#33292B;--line2:#46393C;--acc:#E59AA3;--acc2:#3A2226;--hl:#D2B47E;--bad:#F08C7E;--ok:#7CC6A4;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 50% at 50% 0%,var(--acc2) 0%,var(--bg) 60%) fixed}
button,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2{font-family:var(--serif);font-weight:500;margin:0}
p{margin:0}
.ic{width:20px;height:20px;flex:none}
#root{max-width:600px;margin:0 auto;padding:44px 20px 40px}
.mk{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 18%,transparent);display:grid;place-items:center;color:var(--acc);margin:0 auto 18px}
.mk .ic{width:28px;height:28px}
.w-head{text-align:center;margin-bottom:28px}
.kick{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:500}
.w-head h1,.w-center h1{font-size:2.8rem;line-height:1.08;margin-top:8px}
.lead{color:var(--ink2);font-size:1.08rem;margin-top:12px}
.w-center{text-align:center;padding-top:10vh;display:flex;flex-direction:column;align-items:center;gap:6px}
.w-center .btn{margin-top:18px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.wl{list-style:none;padding:0;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.wl li{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;border-top:1px solid var(--line)}
.wl li:first-child{border-top:0}
.wl .st{width:22px;flex:none;color:var(--hl);padding-top:2px}.wl .st i{display:block;width:6px;height:6px;border-radius:50%;background:var(--line2);margin:9px auto}
.wl .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.wl b{font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.wl small{color:var(--ink3);font-size:.88rem}
.wl a{color:var(--acc);font-size:.88rem;display:inline-flex;gap:5px;align-items:center;text-decoration:none;overflow-wrap:anywhere}.wl a .ic{width:15px;height:15px}
.ib{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--ink3);display:grid;place-items:center;flex:none}.ib:hover{background:var(--bg2);color:var(--ink)}
.none{background:var(--card);border:1px dashed var(--line2);border-radius:18px;padding:26px;text-align:center;color:var(--ink2);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line2);background:var(--card);font-weight:500}
.btn .ic{width:18px;height:18px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#181314}}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad);margin-right:auto}
.btn.big{height:52px;width:100%;font-size:1.05rem;border-radius:13px}
.wform{background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:18px;padding:20px;margin-bottom:18px;display:flex;flex-direction:column;gap:14px}
.wform h2{font-size:1.5rem}
.wform label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--ink2);font-weight:500}
.wform label span{font-weight:400;color:var(--ink3);font-size:.78rem}
.wform input:not([type=checkbox]),.codein input{height:46px;border:1px solid var(--line2);border-radius:11px;background:var(--card);padding:0 13px;font-size:1rem;width:100%;min-width:0}
.wform input:focus,.codein input:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:1px;border-color:transparent}
.wform input.bad{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.wform .chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:.95rem}
.chk input{width:19px;height:19px;accent-color:var(--acc)}.chk .ic{width:17px;height:17px;color:var(--hl)}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.saved{min-height:24px;text-align:center;color:var(--ok);font-size:.92rem;margin:10px 0}
.private{display:flex;gap:10px;align-items:flex-start;color:var(--ink3);font-size:.86rem;padding:14px 4px 0;border-top:1px solid var(--line);margin-top:10px}.private .ic{width:17px;height:17px;margin-top:2px}
.w-foot{text-align:center;color:var(--ink3);font-size:.8rem;margin-top:34px}.w-foot a{color:inherit}
.codein{display:flex;gap:10px;margin-top:22px;width:100%;max-width:340px}.codein input{text-transform:uppercase;letter-spacing:.1em;text-align:center;font-size:1.15rem}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
.muted{color:var(--ink3);text-align:center}
@media (max-width:520px){#root{padding:30px 16px 30px}.w-head h1,.w-center h1{font-size:2.2rem}.two{grid-template-columns:1fr}}
</style></head>

<script>/* Wish list links – shared by the planner and the small wish page (wish/index.html).
   Every person you buy for can get their own link. The link carries an 8-character code; the code alone gives a space id,
   an access token and an AES key (PBKDF2), so the sync server only stores scrambled data it can't read.
   The space holds ONLY that person's wish list ({ for, from, wishes }) – never the planner. Opening the link opens the
   wish page, not the app: the person can add and edit their wishes and sees nothing else (no gifts, no budget, no status).
   The planner reads the space from time to time and copies new wishes into that person's card. */
const WL = (() => {
  const URL0 = () => (window.BP_SYNC_URL || "").replace(/\/+$/, "");
  const ALPH = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const MAX_WISHES = 60;
  const te = new TextEncoder(), td = new TextDecoder(), keys = {};
  const enabled = () => !!URL0() && !!(window.crypto && crypto.subtle);
  function newCode() { let s = ""; while (s.length < 8) { for (const x of crypto.getRandomValues(new Uint8Array(16))) { if (x < 248 && s.length < 8) s += ALPH[x % 31]; } } return s; }
  const clean = c => String(c || "").toUpperCase().replace(/[\s\-–_.]/g, "");
  const valid = c => c.length === 8 && [...c].every(ch => ALPH.includes(ch));
  function b64u(b) { let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function b64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
  function derive(code) {
    if (!keys[code]) keys[code] = (async () => {
      const base = await crypto.subtle.importKey("raw", te.encode("th-xmas-wish|" + code), "PBKDF2", false, ["deriveBits"]);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: te.encode("truehaven-xmas-wishlists-v1"), iterations: 150000 }, base, 640));
      const key = await crypto.subtle.importKey("raw", bits.slice(48, 80), "AES-GCM", false, ["encrypt", "decrypt"]);
      return { sid: b64u(bits.slice(0, 16)), tok: b64u(bits.slice(16, 48)), key };
    })().catch(e => { delete keys[code]; throw e; });
    return keys[code];
  }
  async function seal(k, data) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: te.encode("th-xmas-wish/v1|" + k.sid) }, k.key, te.encode(JSON.stringify(data))));
    return b64(cat(iv, ct));
  }
  async function open(k, s) {
    const all = unb64(s);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12), additionalData: te.encode("th-xmas-wish/v1|" + k.sid) }, k.key, all.slice(12));
    return JSON.parse(td.decode(pt));
  }
  async function req(method, path, k, o = {}) {
    const h = { Authorization: "Bearer " + k.tok };
    if (o.body) h["Content-Type"] = "application/json";
    if (o.ifm != null) h["If-Match"] = String(o.ifm);
    const r = await fetch(URL0() + path, { method, headers: h, body: o.body ? JSON.stringify(o.body) : undefined, cache: "no-store" });
    let j = {}; try { j = await r.json(); } catch (e) { }
    return { s: r.status, j };
  }
  // a wish list as stored: only what the person typed (+ their name and who's asking)
  function cleanList(d) {
    const o = { v: 1, for: String((d && d.for) || "").slice(0, 40), from: String((d && d.from) || "").slice(0, 40), wishes: {} };
    const w = d && d.wishes && typeof d.wishes === "object" ? d.wishes : {};
    Object.keys(w).slice(0, MAX_WISHES * 2).forEach(id => {
      const x = w[id]; if (!x || typeof x !== "object" || String(x.id) !== id) return;
      o.wishes[id] = x.del ? { id, del: true, upd: +x.upd || 0 } : { id, text: String(x.text || "").slice(0, 120), link: /^https?:\/\//i.test(x.link || "") ? String(x.link).slice(0, 400) : "",
        price: String(x.price || "").slice(0, 20), note: String(x.note || "").slice(0, 160), top: !!x.top, upd: +x.upd || 0 };
    });
    return o;
  }
  // merge two copies (two phones of the same person): newest version of every wish wins
  function merge(a, b) {
    const o = cleanList(b.upd >= a.upd ? b : a); o.wishes = {};
    const ids = new Set([...Object.keys(a.wishes || {}), ...Object.keys(b.wishes || {})]);
    ids.forEach(id => { const x = (a.wishes || {})[id], y = (b.wishes || {})[id]; o.wishes[id] = !x ? y : !y ? x : ((y.upd || 0) >= (x.upd || 0) ? y : x); });
    return cleanList(o);
  }
  // create: a fresh code that no other list uses yet
  async function create(forName, fromName) {
    for (let i = 0; i < 6; i++) {
      const code = newCode(), k = await derive(code);
      const v = await req("GET", "/v1/space/" + k.sid + "/version", k);
      if (v.s === 200 || v.s === 403) continue;
      if (v.s === 429) throw new Error("The server is busy – try again in a minute.");
      if (v.s !== 404) throw new Error("Couldn't reach the wish list server.");
      const data = cleanList({ for: forName, from: fromName, wishes: {} });
      const r = await req("PUT", "/v1/space/" + k.sid, k, { ifm: 0, body: { ciphertext: await seal(k, data) } });
      if (r.s === 200) return { code, ver: r.j.version };
      if (r.s === 409) continue;
      throw new Error("Couldn't create the link – try again.");
    }
    throw new Error("Couldn't create the link – try again.");
  }
  async function read(code) {
    const k = await derive(code);
    const r = await req("GET", "/v1/space/" + k.sid, k);
    if (r.s === 404 || r.s === 403) return { gone: true };
    if (r.s !== 200) throw new Error("http " + r.s);
    return { ver: r.j.version, d: cleanList(await open(k, r.j.ciphertext)) };
  }
  async function version(code) {
    const k = await derive(code);
    const r = await req("GET", "/v1/space/" + k.sid + "/version", k);
    if (r.s === 404 || r.s === 403) return { gone: true };
    if (r.s !== 200) throw new Error("http " + r.s);
    return { ver: r.j.version };
  }
  // write the person's list; on a clash (their other phone saved first) merge and try again
  async function write(code, data, ver) {
    const k = await derive(code);
    for (let i = 0; i < 5; i++) {
      const r = await req("PUT", "/v1/space/" + k.sid, k, { ifm: ver, body: { ciphertext: await seal(k, cleanList(data)) } });
      if (r.s === 200) return { ver: r.j.version, d: cleanList(data) };
      if (r.s === 409) { const cur = await read(code); if (cur.gone) return { gone: true }; data = merge(cur.d, data); ver = cur.ver; continue; }
      if (r.s === 404 || r.s === 403) return { gone: true };
      throw new Error("http " + r.s);
    }
    throw new Error("Couldn't save – try again.");
  }
  async function remove(code) { const k = await derive(code); const r = await req("DELETE", "/v1/space/" + k.sid, k); return r.s === 200 || r.s === 404; }
  // the page link: the wish page next to the app's folder (…/christmas/wish/#CODE)
  function link(code) {
    const base = window.BP_WISH_URL || (location.origin + location.pathname.replace(/[^/]*$/, "").replace(/[^/]+\/$/, "") + "wish/");
    return base + "#" + code;
  }
  const fmt = c => c ? c.slice(0, 4) + "-" + c.slice(4) : "";
  return { enabled, newCode, clean, valid, create, read, version, write, remove, merge, cleanList, link, fmt, MAX_WISHES };
})();

/* The wish list page (wish/index.html). Someone opens the link they were sent and writes their wishes.
   This page contains NO planner code and no link to the app: it can only read and write this one wish list. */
(() => {
  const $ = s => document.querySelector(s), root = $("#root");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const IC = { star: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6L12 16.4 6.6 19.4l1.3-6L3.4 9.3l6-.7z"/>', plus: '<path d="M12 5v14M5 12h14"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>', link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    tree: '<path d="M12 2.5 6.5 9.5h3L5.5 15h4l-4 4.5h13l-4-4.5h4l-4-5.5h3z"/><path d="M12 19.5V22"/>' };
  const ic = (n, c = "") => `<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
  let code = "", ver = 0, D = null, busy = false, again = null, edit = null, state = "load", msg = "";
  const live = () => Object.values(D.wishes).filter(w => !w.del).sort((a, b) => b.top - a.top);
  const nid = () => "w" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  let lastTs = 0; const ts = () => (lastTs = Math.max(Date.now(), lastTs + 1));

  function view() {
    if (state === "load") return `<div class="w-center"><div class="spin"></div><p>Opening your wish list…</p></div>`;
    if (state === "code") return `<div class="w-center"><div class="mk">${ic("tree")}</div><h1>Your wish list</h1><p class="lead">This link isn't complete. Type the 8-character code from your message.</p>
      <div class="codein"><input id="cIn" maxlength="9" placeholder="ABCD-EF23" autocomplete="off" autocapitalize="characters" value=""><button class="btn pri" data-a="code">Open</button></div>${msg ? `<p class="err">${esc(msg)}</p>` : ""}</div>`;
    if (state === "gone") return `<div class="w-center"><div class="mk">${ic("tree")}</div><h1>This link is off</h1><p class="lead">This wish list link was turned off. Ask the person who sent it for a new one.</p></div>`;
    if (state === "err") return `<div class="w-center"><div class="mk">${ic("tree")}</div><h1>Can't reach your list</h1><p class="lead">${esc(msg || "Check your internet connection and try again.")}</p><button class="btn pri" data-a="retry">Try again</button></div>`;
    const ws = live(), full = ws.length >= WL.MAX_WISHES, f = edit && edit !== "new" ? D.wishes[edit] : null;
    const form = edit ? `<div class="wform" id="wf"><h2>${f ? "Edit wish" : "Add a wish"}</h2>
      <label>What would you like?<input id="fT" maxlength="120" value="${esc(f ? f.text : "")}" placeholder="e.g. Red winter gloves"></label>
      <div class="two"><label>Price <span>optional</span><input id="fP" maxlength="20" value="${esc(f ? f.price : "")}" placeholder="about 30"></label><label>Link <span>optional</span><input id="fL" type="url" maxlength="400" value="${esc(f ? f.link : "")}" placeholder="https://…"></label></div>
      <label>Note <span>optional</span><input id="fN" maxlength="160" value="${esc(f ? f.note : "")}" placeholder="Size, color, any shop is fine…"></label>
      <label class="chk"><input type="checkbox" id="fS" ${f && f.top ? "checked" : ""}> ${ic("star")} One of my favorites</label>
      <div class="acts">${f ? `<button class="btn ghost danger" data-a="del" data-id="${esc(edit)}">Delete</button>` : ""}<button class="btn ghost" data-a="cancel">Cancel</button><button class="btn pri" data-a="save">${f ? "Save" : "Add to my list"}</button></div></div>` : "";
    return `<header class="w-head"><div class="mk">${ic("tree")}</div><p class="kick">Christmas wish list</p><h1>Hi ${esc(D.for || "there")}!</h1>
      <p class="lead">${D.from ? `${esc(D.from)} would love to know what you'd like this year.` : "What would you like for Christmas this year?"} Add as many wishes as you like – with a link or a price if that helps.</p></header>
      <main class="w-main">${ws.length ? `<ul class="wl">${ws.map(w => `<li class="${w.top ? "top" : ""}"><span class="st">${w.top ? ic("star") : "<i></i>"}</span><div class="tx"><b>${esc(w.text)}</b><small>${[w.price && esc(w.price), w.note && esc(w.note)].filter(Boolean).join(" · ")}</small>${w.link ? `<a href="${esc(w.link)}" target="_blank" rel="noopener nofollow">${ic("link")}${esc(w.link.replace(/^https?:\/\/(www\.)?/, "").slice(0, 40))}</a>` : ""}</div><button class="ib" data-a="edit" data-id="${esc(w.id)}" aria-label="Edit">${ic("edit")}</button></li>`).join("")}</ul>`
        : !edit ? `<div class="none"><p>Your list is empty – add your first wish.</p></div>` : ""}
      ${form}${!edit ? (full ? `<p class="muted">That's a long list – ${WL.MAX_WISHES} wishes is the most.</p>` : `<button class="btn pri big" data-a="new">${ic("plus")}Add a wish</button>`) : ""}
      <p class="saved" id="sv" aria-live="polite">${msg ? esc(msg) : ""}</p>
      <div class="private">${ic("lock")}<p>Saved as you go. Only your list is on this page – you can come back to this link any time to change it.</p></div></main>
      <footer class="w-foot">Christmas wish list · <a href="${esc(window.BP_SHOP || "#")}" target="_blank" rel="noopener">made with the TrueHaven Christmas Planner</a></footer>`;
  }
  function draw() { root.innerHTML = view(); const f = $("#fT") || $("#cIn"); if (f && (edit || state === "code")) f.focus(); }

  async function open(c) {
    code = c; state = "load"; draw();
    try { const r = await WL.read(code); if (r.gone) { state = "gone"; return draw(); } ver = r.ver; D = r.d; state = "ok"; draw(); }
    catch (e) { state = "err"; msg = ""; draw(); }
  }
  async function push(text) {
    if (busy) { again = text || again || "Saved ✓"; return; }
    busy = true; setMsg("Saving…");
    try { const r = await WL.write(code, D, ver); if (r.gone) { state = "gone"; return draw(); } ver = r.ver; D = WL.merge(r.d, D); setMsg(text || "Saved ✓"); }
    catch (e) { setMsg("Couldn't save – check your internet and try again."); }
    finally { busy = false; }
    if (!edit) draw();
    if (again) { const t = again; again = null; push(t); }
  }
  function setMsg(m) { msg = m; const s = $("#sv"); if (s) s.textContent = m; }
  async function refresh() {
    if (state !== "ok" || busy || edit) return;
    try { const v = await WL.version(code); if (v.gone) { state = "gone"; return draw(); } if (v.ver !== ver) { const r = await WL.read(code); if (!r.gone) { D = WL.merge(r.d, D); ver = r.ver; draw(); } } } catch (e) { }
  }
  const A = {
    code: () => { const c = WL.clean($("#cIn").value); if (!WL.valid(c)) { msg = "That code doesn't look right – it has 8 letters and numbers."; return draw(); } msg = ""; history.replaceState(null, "", "#" + c); open(c); },
    retry: () => open(code), new: () => { edit = "new"; msg = ""; draw(); }, edit: d => { edit = d.id; msg = ""; draw(); }, cancel: () => { edit = null; draw(); },
    save: () => {
      const t = $("#fT").value.trim(); if (!t) { $("#fT").classList.add("bad"); $("#fT").focus(); return; }
      const link = $("#fL").value.trim(), w = { id: edit === "new" ? nid() : edit, text: t.slice(0, 120), price: $("#fP").value.trim().slice(0, 20), note: $("#fN").value.trim().slice(0, 160),
        link: !link ? "" : /^https?:\/\//i.test(link) ? link : "https://" + link, top: $("#fS").checked, upd: ts() };
      if (edit === "new" && live().length >= WL.MAX_WISHES) return;
      const isNew = edit === "new"; D.wishes[w.id] = w; edit = null; draw(); push(isNew ? "Added ✓" : "Saved ✓");
    },
    del: d => { D.wishes[d.id] = { id: d.id, del: true, upd: ts() }; edit = null; draw(); push("Deleted ✓"); }
  };
  root.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; e.preventDefault(); const f = A[b.dataset.a]; f && f(b.dataset); });
  root.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); const p = root.querySelector(".wform .btn.pri, .codein .btn.pri"); p && p.click(); } if (e.key === "Escape" && edit) A.cancel(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  setInterval(() => { if (!document.hidden) refresh(); }, 90e3);
  addEventListener("hashchange", () => { const c = WL.clean(location.hash.slice(1)); if (WL.valid(c) && c !== code) open(c); });
  if (!WL.enabled()) { state = "err"; msg = "This browser can't open the wish list (it needs a secure https page)."; draw(); return; }
  const c = WL.clean(location.hash.slice(1));
  if (WL.valid(c)) open(c); else { state = "code"; draw(); }
})();
</script>
</body></html>
